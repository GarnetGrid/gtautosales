<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
    <defs>
        <linearGradient id="garnet-face1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9b1b30"/>
            <stop offset="100%" stop-color="#d4374a"/>
        </linearGradient>
        <linearGradient id="garnet-face2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e63946"/>
            <stop offset="100%" stop-color="#7a1525"/>
        </linearGradient>
        <linearGradient id="garnet-face3" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ff6b6b"/>
            <stop offset="100%" stop-color="#c0392b"/>
        </linearGradient>
        <linearGradient id="garnet-shine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>
        <filter id="gem-glow">
            <feGaussianBlur stdDeviation="0.8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <style>
    @keyframes facet-shimmer {
      0%, 100% { opacity: 0; }
      15%      { opacity: 0.9; }
      30%      { opacity: 0; }
    }
    @keyframes gem-rotate {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25%      { transform: rotate(3deg) scale(1.02); }
      75%      { transform: rotate(-3deg) scale(1.02); }
    }
    @keyframes sparkle-pop {
      0%, 100% { opacity: 0; transform: scale(0); }
      50%      { opacity: 1; transform: scale(1); }
    }
    .gem-body {
      transform-origin: 12px 12px;
      animation: gem-rotate 4s ease-in-out infinite;
    }
    .shimmer-1 { animation: facet-shimmer 3s ease-in-out infinite; }
    .shimmer-2 { animation: facet-shimmer 3s ease-in-out infinite; animation-delay: 1s; }
    .shimmer-3 { animation: facet-shimmer 3s ease-in-out infinite; animation-delay: 2s; }
    .sparkle {
      transform-origin: center;
      animation: sparkle-pop 2.5s ease-in-out infinite;
    }
    .sparkle:nth-child(2) { animation-delay: 0.8s; }
    .sparkle:nth-child(3) { animation-delay: 1.6s; }
    </style>

    <g class="gem-body" filter="url(#gem-glow)">
        <!-- Bottom facet -->
        <polygon points="12,22 4,10 20,10" fill="url(#garnet-face1)"/>
        <!-- Top-left facet -->
        <polygon points="4,10 8,3 12,6 12,10" fill="url(#garnet-face2)"/>
        <!-- Top-right facet -->
        <polygon points="20,10 16,3 12,6 12,10" fill="url(#garnet-face3)"/>
        <!-- Crown facet -->
        <polygon points="8,3 12,1.5 16,3 12,6" fill="#e63946"/>
        <!-- Left body facet -->
        <polygon points="4,10 12,10 12,22" fill="url(#garnet-face2)" opacity="0.7"/>
        <!-- Right body facet -->
        <polygon points="20,10 12,10 12,22" fill="url(#garnet-face1)" opacity="0.8"/>

        <!-- Facet edge highlights -->
        <line x1="12" y1="6" x2="12" y2="22" stroke="rgba(255,255,255,0.15)" stroke-width="0.3"/>
        <line x1="4" y1="10" x2="20" y2="10" stroke="rgba(255,255,255,0.15)" stroke-width="0.3"/>
        <line x1="12" y1="6" x2="4" y2="10" stroke="rgba(255,255,255,0.1)" stroke-width="0.3"/>
        <line x1="12" y1="6" x2="20" y2="10" stroke="rgba(255,255,255,0.1)" stroke-width="0.3"/>

        <!-- Shimmer overlays -->
        <polygon class="shimmer-1" points="4,10 12,10 12,22" fill="url(#garnet-shine)" opacity="0"/>
        <polygon class="shimmer-2" points="20,10 12,10 12,22" fill="url(#garnet-shine)" opacity="0"/>
        <polygon class="shimmer-3" points="8,3 12,1.5 16,3 12,6" fill="url(#garnet-shine)" opacity="0"/>
    </g>

    <!-- Sparkle particles -->
    <g class="sparkles">
        <circle class="sparkle" cx="3" cy="5" r="0.8" fill="white" opacity="0"/>
        <circle class="sparkle" cx="21" cy="4" r="0.6" fill="white" opacity="0"/>
        <circle class="sparkle" cx="22" cy="16" r="0.7" fill="white" opacity="0"/>
    </g>
</svg>
