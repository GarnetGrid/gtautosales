<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
    <defs>
        <linearGradient id="gt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e63946"/>
            <stop offset="100%" stop-color="#ff6b6b"/>
        </linearGradient>
        <linearGradient id="dial-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1a3a5c"/>
            <stop offset="60%" stop-color="#e63946"/>
            <stop offset="100%" stop-color="#ff4757"/>
        </linearGradient>
        <filter id="gt-glow">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <style>
    @keyframes needle-sweep {
      0%   { transform: rotate(-130deg); }
      60%  { transform: rotate(105deg); }
      75%  { transform: rotate(85deg); }
      85%  { transform: rotate(100deg); }
      100% { transform: rotate(90deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }
    @keyframes speed-line {
      0%   { stroke-dashoffset: 20; opacity: 0; }
      30%  { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes gt-reveal {
      0%   { opacity: 0; transform: scale(0.8); }
      50%  { opacity: 0; transform: scale(0.8); }
      80%  { opacity: 1; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes ring-draw {
      0%   { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    .needle {
      transform-origin: 30px 32px;
      animation: needle-sweep 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .speed-line {
      stroke-dasharray: 8 12;
      animation: speed-line 1.2s ease-out forwards;
    }
    .speed-line:nth-child(2) { animation-delay: 0.1s; }
    .speed-line:nth-child(3) { animation-delay: 0.2s; }
    .speed-line:nth-child(4) { animation-delay: 0.15s; }
    .gt-text {
      animation: gt-reveal 1.8s ease-out forwards;
    }
    .dial-arc {
      stroke-dasharray: 160;
      animation: ring-draw 1.5s ease-out forwards;
    }
    .redline-pulse {
      animation: pulse-glow 2s ease-in-out infinite;
      animation-delay: 1.8s;
      opacity: 0;
    }
    </style>

    <!-- Background circle -->
    <circle cx="30" cy="30" r="29" fill="#0a1f33" stroke="#1a3a5c" stroke-width="1"/>

    <!-- Tachometer arc -->
    <path class="dial-arc" d="M 8 40 A 24 24 0 0 1 52 40" fill="none" stroke="url(#dial-grad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Tick marks -->
    <g stroke="#2a4a6c" stroke-width="1" opacity="0.6">
        <line x1="10" y1="38" x2="14" y2="35"/>
        <line x1="13" y1="28" x2="17" y2="28"/>
        <line x1="19" y1="19" x2="22" y2="22"/>
        <line x1="30" y1="14" x2="30" y2="18"/>
        <line x1="41" y1="19" x2="38" y2="22"/>
        <line x1="47" y1="28" x2="43" y2="28"/>
        <line x1="50" y1="38" x2="46" y2="35"/>
    </g>

    <!-- Redline zone highlight -->
    <path class="redline-pulse" d="M 44 22 A 24 24 0 0 1 52 40" fill="none" stroke="#e63946" stroke-width="3" stroke-linecap="round" opacity="0"/>

    <!-- Speed lines (radiating outward on load) -->
    <line class="speed-line" x1="52" y1="16" x2="58" y2="10" stroke="#e63946" stroke-width="1.5" opacity="0"/>
    <line class="speed-line" x1="55" y1="26" x2="62" y2="24" stroke="#ff6b6b" stroke-width="1" opacity="0"/>
    <line class="speed-line" x1="50" y1="12" x2="54" y2="4" stroke="#e63946" stroke-width="1" opacity="0"/>
    <line class="speed-line" x1="56" y1="34" x2="62" y2="35" stroke="#ff6b6b" stroke-width="1" opacity="0"/>

    <!-- Needle -->
    <line class="needle" x1="30" y1="32" x2="30" y2="14" stroke="url(#gt-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Needle pivot -->
    <circle cx="30" cy="32" r="3" fill="#e63946"/>
    <circle cx="30" cy="32" r="1.5" fill="#0a1f33"/>

    <!-- GT text -->
    <text class="gt-text" x="30" y="50" text-anchor="middle" font-family="'Roboto', Arial, sans-serif" font-weight="900" font-size="14" fill="url(#gt-grad)" filter="url(#gt-glow)" opacity="0">GT</text>
</svg>
